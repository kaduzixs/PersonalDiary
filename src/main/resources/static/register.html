<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register for User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        min-height: 100vh;
        background-color: #14453F;
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
    }
    .topnav {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        background-color: #0D2F2B;
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .topnav-logo img {
        width: 40px;
        height: 40px;
        object-fit: contain;
    }
    .topnav-links {
        display: flex;
        gap: 24px;
    }
    .topnav-links a {
        color: white;
        text-decoration: none;
        text-shadow: 1px 1px 2px black;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: opacity 0.2s;
    }
    .topnav-links a:hover {
        opacity: 0.75;
    }
    .login-card {
        width: 100%;
        max-width: 400px;
        background-color: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 40px;
    }
    .topnav-links i {
        font-size: 16px;
    }
    .login-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px;
    }
    .user-icon {
        width: 64px;
        height: 64px;
        object-fit: contain;
        margin-bottom: 8px;
    }
    .input-box {
        position: relative;
        width: 100%;
        margin: 10px 0;
    }
    .info-user {
        color: white;
        text-shadow: 2px 2px 2px black;
        font-size: 1.5rem;
        margin-bottom: 20px;
        text-align: center;
    }
    .input-box i {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: black;
        font-size: 16px;
        pointer-events: none;
    }
    .input-box input {
        width: 100%;
        padding: 8px 12px 8px 34px;
        border-radius: 10px;
        border: none;
        box-shadow: 2px 2px 4px black;
        font-size: 14px;
    }
    .input-box input::placeholder {
        color: #444;
    }
    #alerta {
        width: 100%;
        color: white;
        text-shadow: 2px 2px 2px black;
        padding: 6px 0;
        margin: 4px 0;
        font-size: 13px;
        text-align: center;
        min-height: 28px;
    }
    .input-box input:focus {
        outline: none;
        box-shadow: 2px 2px 6px #000, 0 0 0 2px rgba(255,255,255,0.4);
    }
    .btn {
        border-radius: 20px;
        background-color: black;
        color: white;
        padding: 8px 48px;
        border: none;
        margin-top: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: background-color 0.2s, color 0.2s, box-shadow 0.2s, border-radius 0.2s;
    }
    .btn:hover {
        background-color: white;
        color: black;
        border-radius: 30px;
        box-shadow: 2px 2px 6px black;
    }
    @media (max-width: 768px) {
        .login-card {
            padding: 24px 28px;
        }
        .topnav {
            padding: 10px 16px;
        }
    }
    @media (max-width: 480px) {
        .login-card {
            padding: 20px 16px;
        }
        .info-user {
            font-size: 1.2rem;
        }
        .btn {
            width: 100%;
            padding: 10px;
        }
        .topnav-links {
            gap: 16px;
        }
        .topnav-links a {
            font-size: 13px;
        }
    }
    @media (max-width: 360px) {
        .topnav-links a span {
            display: none;
        }
    }
</style>
<body>
<nav class="topnav">
    <div class="topnav-logo">
        <img src="https://img.icons8.com/?size=100&id=O_27qvGZ5ys7&format=png&color=FFFFFF" alt="logo">
    </div>
    <div class="topnav-links">
        <a href="login.html"><i class="bx bxs-home"></i>Home</a>
        <a href="login.html"><i class="bx bxs-user"></i>Login</a>
    </div>
</nav>
<div class="login-wrapper">
    <div class="login-card">
        <img src="https://img.icons8.com/?size=100&id=zxB19VPoVLjK&format=png&color=000000" alt="user" class="user-icon">
        <h1 class="info-user">Welcome</h1>
        <div class="input-box">
            <i class="bx bxs-user"></i>
            <input type="text" name="user" id="user" placeholder="Type your user...">
        </div>
        <div class="input-box">
            <i class="bx bxs-lock-alt"></i>
            <input type="password" name="password" id="password" placeholder="Type your password...">
        </div>
        <p id="alerta"></p>
        <button type="button" class="btn" id="button-1">Register</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    let mensagem = document.getElementById('alerta');
    let button_1 = document.getElementById('button-1');
    let name = document.getElementById('user');
    let senha = document.getElementById('password');

    button_1.addEventListener("click", () => {
        if (name.value == "" && senha.value == ""){
            mensagem.textContent = "Prencha todos os campos prfv!!!";
        }
        else {
            window.location.href = "index.html";
        }
    });
</script>
</body>
</html>
