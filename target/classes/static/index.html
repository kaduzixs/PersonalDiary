<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diary personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<style>
    body{
        min-height: 100vh;
        background-color: #14453F;
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
    }

    .cornav {

        background-color: #0D2F2B;
    }

    .search {
        font-size: small;
        color: white;
    }
    .input-box i{
        left: 10px;
        top: 50%;
        transform: translateY(50%);
        color: white;
        font-size: 16px;
        pointer-events: none;
    }

    .area{
        background-color: #464545;

    }
    .hr {
        background-color: #FFFF;
        width: 90%;
        height: 2px;
        margin: auto;
    }

    .area::placeholder{
        color: white;
    }
    .search::placeholder {
        color: white;

    }
    .topnav{
        width: 100%;
        padding: 12px 24px;


    }
    .topnav-logo img {
        width: 100px;
        height: 40px;
        object-fit: contain;
    }
    .btn-replacement{
        padding: 10px ;
        margin: 2px;
        background: transparent;
        border: none;
        color: white;
        font-size: 20px;



    }
    h1{
        color: white;
    }
    .node{
        background-color: #0D2F2B;
    }
    .painel{
        background-color: #0D2F2B;
    }
    textarea::placeholder{
        padding: 20px;
    }


    @media (max-width: 768px) {
        .panel{
            padding: 24px 28px;
        }
        .topnav {
            padding: 10px 16px;
        }
        .navtext{
            font-size: 1.2rem;
        }
    }
    @media (max-width: 480px) {
        .main-user{
            padding: 20px 16px;
        }
        .panel {
            padding: 20px 16px;
        }
        .navtext {
            font-size: 1.2rem;
        }
        .btn {
            width: 100%;
            padding: 10px;
        }
        .topnav-links {
            gap: 16px;
        }
        .topnav-links a {
            font-size: 13px;
        }
    }
    @media (max-width: 360px) {
        .topnav-links a span {
            display: none;
        }
    }
</style>

<body>
<nav class="main-user navbar cornav">
    <div class="container-fluid text-white ">
        <a class="navbar-brand text-white">
            <img onclick="" src="https://img.icons8.com/?size=100&id=83136&format=png&color=FFFFFF" alt="logo" width="30%"
                 class="me-2 p-1">
            Journal
        </a>

        <form class="d-flex justify-content-center w-25 p-4 " role="search">
            <div class="input-box">

                <input class="rounded-3 p-2 border-0 w-100 bg-dark search" type="search"
                       placeholder="type your text..." aria-label="Search">
            </div>
        </form>

        <div class="topnav-links text-white me-4 p-4 ">
            <a href="#" class="text-white text-decoration-none me-4 p-4"><i class="bx bxs-chat"></i>Support</a>
            <a href="login.html" class="text-white text-decoration-none ms-4 "><i class="bx bxs-exit"></i>Exit</a>

        </div>

        <a class="navbar-brand text-white">
            <img src="https://img.icons8.com/?size=100&id=iBZNHkGbms4H&format=png&color=737373" alt="logo"
                 width="70%" class=""></a>
    </div>
</nav>

<div class="container-fluid my-5">

    <div class="panel row justify-content-center">
        <div class="col-3 bg-dark p-1 ">
            <button class="btn-replacement ">Personal date</button>
            <div class="hr mb-5 "></div>
            <button class="btn-replacement">Task</button>
            <div class="hr mb-5 "></div>
            <button class="btn-replacement">Important dates</button>
            <div class="hr mb-5 "></div>
            <button class="btn-replacement">Calender</button>
            <div class="hr mb-5 "></div>
        </div>

        <div class="navtext col-8 mx-4 bg-dark p-5">
            <h1 class="pb-4 pt-4 text-center  ">Personal date</h1>
            <div class="hr mb-5"></div>
            <textarea name="" cols="120" rows="20" id="nodpad" placeholder="Type your text..."
                      class="area text-white "></textarea>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
